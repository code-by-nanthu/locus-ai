name: Release Automation (D-4 / DIST-1..5)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build Native Standalone Binary (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            outfile: locus-linux-x64
          - os: macos-latest
            target: darwin-arm64
            outfile: locus-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install pnpm & Node.js
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies & build web bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm build:web
      - name: Compile Native Standalone Binary
        run: |
          mkdir -p dist/bin
          bun build --compile src/index.tsx --outfile dist/bin/${{ matrix.outfile }} --external playwright --external chromium-bidi
          chmod +x dist/bin/${{ matrix.outfile }}
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum dist/bin/${{ matrix.outfile }} > dist/bin/${{ matrix.outfile }}.sha256
          else
            shasum -a 256 dist/bin/${{ matrix.outfile }} > dist/bin/${{ matrix.outfile }}.sha256
          fi
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.outfile }}
          path: dist/bin/*

  release:
    name: Publish Release Assets
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
